[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traject-backend"
version = "0.1.0"
description = "TRAJECT backend domain, schema validation, and data normalization engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TRAJECT Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "telethon>=1.36.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=15.0.0",
    "tzdata; sys_platform == 'win32'",
    "langdetect>=1.0.9",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.3.0",
    "pyjwt[crypto]>=2.8.0",
    "aiogram>=3.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
asyncio_mode = "auto"


