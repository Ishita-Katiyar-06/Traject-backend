[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traject-backend"
version = "0.1.0"
description = "TRAJECT backend domain, schema validation, and data normalization engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TRAJECT Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "telethon>=1.36.0",
    "python-dotenv>=1.0.0",
]


[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
asyncio_mode = "auto"

